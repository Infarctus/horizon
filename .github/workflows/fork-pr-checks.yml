name: Fork PR Checks

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA on this fork to check
        required: true
        type: string
      base:
        description: Upstream branch on horizon-rust/horizon to diff against
        required: false
        default: main
        type: string
      mode:
        description: "Check suite: pr-ready (Self-check block), verify (parallel clippy+tests), quick (targeted), full (all)"
        required: false
        default: pr-ready
        type: choice
        options:
          - pr-ready
          - verify
          - quick
          - full
      crates:
        description: Optional space-separated crate names (e.g. horizon-client-lib horizon-world)
        required: false
        default: ""
        type: string
      test_filter:
        description: Optional cargo test filter (used in quick/verify or as an extra job in full mode)
        required: false
        default: ""
        type: string
      run_ignored:
        description: Pass -- --ignored to targeted test_filter runs (requires test_filter; no vanilla .local/ data)
        required: false
        default: false
        type: boolean
      run_mod_api:
        description: Force parallel tools/check_mod_api_unchanged.py --allow-added (auto-runs in verify/full when mod API is touched)
        required: false
        default: false
        type: boolean
      build_fast:
        description: Also run parallel cargo build --locked --profile fast -p horizon-game
        required: false
        default: false
        type: boolean
      fail_fast:
        description: Gate pr-ready on fast-checks passing first (skip 30m Rust run on fast lint/fmt/Python failures)
        required: false
        default: true
        type: boolean
      force_pr_ready:
        description: Force PR Ready (Self-check) to run immediately, bypassing fast-checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-pr-checks-${{ inputs.ref }}-${{ inputs.mode }}
  cancel-in-progress: true

env:
  HORIZON_TELEMETRY_URL: "off"
  HORIZON_NO_AUDIO: "1"
  WGPU_BACKEND: "dx12"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep Cargo.toml's [profile.dev] debug = "line-tables-only":
  # crash::tests::the_debug_crash_is_reported_as_vanillas requires line tables,
  # and uniform debuginfo maximizes sccache hit sharing across jobs.

jobs:
  scope:
    name: "Scope (${{ inputs.mode }} @ ${{ inputs.ref }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base_ref: ${{ steps.inspect.outputs.base_ref }}
      head_sha: ${{ steps.inspect.outputs.head_sha }}
      merge_base: ${{ steps.inspect.outputs.merge_base }}
      rust: ${{ steps.inspect.outputs.rust }}
      server_build: ${{ steps.inspect.outputs.server_build }}
      launcher: ${{ steps.inspect.outputs.launcher }}
      mod_api: ${{ steps.inspect.outputs.mod_api }}
      touched_crates: ${{ steps.inspect.outputs.touched_crates }}
    steps:
      - name: Validate inputs
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_CRATES: ${{ inputs.crates }}
          INPUT_RUN_IGNORED: ${{ inputs.run_ignored }}
          INPUT_TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          set -euo pipefail
          if [ "$INPUT_REF" = "fork-ci" ]; then
            echo "::error::Cannot run checks against the fork-ci branch itself. Pass a feature branch or commit SHA."
            exit 1
          fi
          if [[ ! "$INPUT_BASE" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid base branch name: $INPUT_BASE"
            exit 1
          fi
          if [ "$INPUT_RUN_IGNORED" = "true" ] && [ -z "$INPUT_TEST_FILTER" ]; then
            echo "::error::run_ignored=true requires test_filter so data-backed daily tests are not run without vanilla resources."
            exit 1
          fi
          if [ -n "$INPUT_CRATES" ]; then
            for c in $INPUT_CRATES; do
              if [[ ! "$c" =~ ^[A-Za-z0-9_-]+$ ]]; then
                echo "::error::Invalid crate name: $c"
                exit 1
              fi
            done
          fi

      - name: Checkout target ref from fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch upstream base ref and compute scope
        id: inspect
        env:
          INPUT_BASE: ${{ inputs.base }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/horizon-rust/horizon.git
          git fetch --no-tags --filter=blob:none upstream "refs/heads/${INPUT_BASE}:refs/remotes/upstream/${INPUT_BASE}"

          BASE_REF="upstream/${INPUT_BASE}"
          HEAD_SHA="$(git rev-parse HEAD)"
          MERGE_BASE="$(git merge-base HEAD "$BASE_REF")"

          rust_needed=true
          server_needed=false
          launcher_needed=false
          mod_api_needed=false
          if [ -f tools/ci/rust_changes.py ]; then
            rust_out="$(python3 tools/ci/rust_changes.py "$MERGE_BASE" "$HEAD_SHA" || true)"
            launcher_out="$(python3 tools/ci/rust_changes.py --launcher "$MERGE_BASE" "$HEAD_SHA" || true)"
            rust_needed="$(printf '%s\n' "$rust_out" | awk -F= '$1=="required"{print $2}' | tail -n1)"
            server_needed="$(printf '%s\n' "$rust_out" | awk -F= '$1=="server_build"{print $2}' | tail -n1)"
            mod_api_needed="$(printf '%s\n' "$rust_out" | awk -F= '$1=="mod_api"{print $2}' | tail -n1)"
            launcher_needed="$(printf '%s\n' "$launcher_out" | awk -F= '$1=="required"{print $2}' | tail -n1)"
          fi
          rust_needed="${rust_needed:-true}"
          server_needed="${server_needed:-false}"
          launcher_needed="${launcher_needed:-false}"
          mod_api_needed="${mod_api_needed:-false}"

          touched="$(python3 - "$BASE_REF" <<'PY'
          import sys
          sys.path.insert(0, ".")
          from tools import parity, pr_ready

          changed = parity.changed_files(sys.argv[1]) or []
          if not any(pr_ready.workspace_rust(p) for p in changed):
              print("__NONE__")
              sys.exit(0)
          crates_of, _, _ = pr_ready.packages()
          crates = pr_ready.touched_crates(changed, crates_of)
          if crates is None:
              print("__WORKSPACE__")
          elif not crates:
              print("__NONE__")
          else:
              print(" ".join(crates))
          PY
          )"

          {
            echo "base_ref=$BASE_REF"
            echo "head_sha=$HEAD_SHA"
            echo "merge_base=$MERGE_BASE"
            echo "rust=$rust_needed"
            echo "server_build=$server_needed"
            echo "launcher=$launcher_needed"
            echo "mod_api=$mod_api_needed"
            echo "touched_crates=$touched"
          } >> "$GITHUB_OUTPUT"

          echo "Ref '${INPUT_REF}' at ${HEAD_SHA} vs ${BASE_REF} (merge base ${MERGE_BASE})"
          echo "Scope: rust=$rust_needed server=$server_needed launcher=$launcher_needed mod_api=$mod_api_needed touched=$touched"

  fast-checks:
    name: "Fast checks (fmt, tree, layers, hotspots, Python)"
    needs: scope
    if: >-
      !cancelled() &&
      needs.scope.result == 'success' &&
      !inputs.force_pr_ready
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head_sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Fetch upstream base ref
        env:
          INPUT_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/horizon-rust/horizon.git
          git fetch --no-tags --filter=blob:none upstream "refs/heads/${INPUT_BASE}:refs/remotes/upstream/${INPUT_BASE}"

      - name: Run tree, hygiene, layers, addresses, hotspots, nested locks, rustfmt, and Python tests
        env:
          BASE_REF: ${{ needs.scope.outputs.base_ref }}
          MERGE_BASE: ${{ needs.scope.outputs.merge_base }}
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/horizon-scratch"
          mkdir -p "$scratch/home" "$scratch/data" "$scratch/config"
          export HORIZON_HOME="$scratch/home" XDG_DATA_HOME="$scratch/data" XDG_CONFIG_HOME="$scratch/config"

          python3 tools/check_public_tree.py
          if [ -f tools/ci/check_repository_hygiene.py ]; then
            python3 tools/ci/check_repository_hygiene.py
          fi
          python3 tools/check_layers.py --base "$BASE_REF"
          python3 tools/check_addresses.py --base "$BASE_REF"
          if [ -f tools/hotspots/check_lists.py ]; then
            python3 tools/hotspots/check_lists.py
          fi
          if [ -f tools/hotspots/check_stand_ins.py ]; then
            python3 tools/hotspots/check_stand_ins.py
          fi
          if [ -f tools/ci/nested_locks.py ]; then
            python3 tools/ci/nested_locks.py --base "$MERGE_BASE"
          fi

          mapfile -t changed_root_rs < <(git diff --name-only --diff-filter=ACMR "$MERGE_BASE"...HEAD -- '*.rs' ':!launcher/**')
          existing_root_rs=()
          for f in "${changed_root_rs[@]}"; do
            [ -f "$f" ] && existing_root_rs+=("$f")
          done
          if [ "${#existing_root_rs[@]}" -gt 0 ]; then
            echo "Checking rustfmt (edition 2024) on ${#existing_root_rs[@]} changed Rust file(s)..."
            rustfmt --edition 2024 --check --config skip_children=true "${existing_root_rs[@]}"
          fi

          mapfile -t changed_launcher_rs < <(git diff --name-only --diff-filter=ACMR "$MERGE_BASE"...HEAD -- 'launcher/**/*.rs')
          if [ "${#changed_launcher_rs[@]}" -gt 0 ]; then
            echo "Checking launcher rustfmt..."
            cargo fmt --manifest-path launcher/Cargo.toml -- --check
          fi

          if [ -f tools/ci/unittest_parallel.py ]; then
            env -u GITHUB_REPOSITORY python3 tools/ci/unittest_parallel.py
          else
            env -u GITHUB_REPOSITORY python3 -m unittest discover -s tests
          fi

  pr-ready:
    name: "PR Ready (Self-check)"
    needs: [scope, fast-checks]
    if: >-
      !cancelled() &&
      needs.scope.result == 'success' &&
      (inputs.force_pr_ready || ((inputs.mode == 'pr-ready' || inputs.mode == 'full') && (needs.fast-checks.result == 'success' || !inputs.fail_fast)))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Ensure sufficient disk space on ubuntu-latest
        run: |
          set -euo pipefail
          avail_gb=$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')
          echo "Available disk space on /: ${avail_gb}G"
          if [ "${avail_gb:-0}" -lt 40 ]; then
            echo "Below 40G threshold; pruning preinstalled SDKs in parallel..."
            sudo rm -rf /usr/share/dotnet &
            sudo rm -rf /usr/local/lib/android &
            sudo rm -rf /opt/ghc &
            sudo rm -rf /opt/hostedtoolcache/CodeQL &
            sudo rm -rf /usr/local/.ghcup &
            wait
          fi
          df -h /

      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head_sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch upstream base ref
        env:
          INPUT_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/horizon-rust/horizon.git
          git fetch --no-tags --filter=blob:none upstream "refs/heads/${INPUT_BASE}:refs/remotes/upstream/${INPUT_BASE}"

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Rust toolchain and Linux build dependencies
        env:
          NEED_LAUNCHER: ${{ needs.scope.outputs.launcher }}
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/horizon-scratch"
          mkdir -p "$scratch/home" "$scratch/data" "$scratch/config"
          {
            echo "HORIZON_HOME=$scratch/home"
            echo "XDG_DATA_HOME=$scratch/data"
            echo "XDG_CONFIG_HOME=$scratch/config"
          } >> "$GITHUB_ENV"

          apt_pkgs=(libasound2-dev libudev-dev pkg-config mold)
          if [ "$NEED_LAUNCHER" = "true" ]; then
            apt_pkgs+=(libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev)
          fi
          if [ -f tools/ci/install_rust.sh ]; then
            HOSTED=true bash tools/ci/install_rust.sh "${apt_pkgs[@]}"
            rustup default stable
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends -o Dpkg::Use-Pty=false "${apt_pkgs[@]}"
            rustup toolchain install stable --profile minimal --component rustfmt --component clippy
            rustup default stable
          fi
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker-features=-lld -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure sccache wrapper
        run: |
          set -euo pipefail
          {
            echo "SCCACHE_GHA_ENABLED=true"
            if [ -f "$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh" ]; then
              chmod +x "$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh"
              echo "RUSTC_WRAPPER=$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh"
            else
              echo "RUSTC_WRAPPER=sccache"
            fi
          } >> "$GITHUB_ENV"

      - name: Cache Cargo registry and build dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fork-pr-checks-pr-ready-v1
          cache-on-failure: true
          save-if: ${{ needs.scope.outputs.rust == 'true' }}

      - name: Cache launcher workspace dependencies
        if: needs.scope.outputs.launcher == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: launcher
          shared-key: fork-pr-checks-launcher-v1
          cache-on-failure: true
          save-if: ${{ needs.scope.outputs.launcher == 'true' }}

      - name: Run tools/pr_ready.py
        env:
          BASE_REF: ${{ needs.scope.outputs.base_ref }}
        run: |
          set -euo pipefail
          raw_out="$RUNNER_TEMP/pr-ready-raw.md"
          summary_out="$RUNNER_TEMP/pr-ready-summary.md"
          status=0
          env -u GITHUB_REPOSITORY python3 tools/pr_ready.py --base "$BASE_REF" >"$raw_out" || status=$?

          python3 - "$raw_out" "$summary_out" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          text = re.sub(r"host `[^`]+`", "host `ci`", text)
          Path(sys.argv[2]).write_text(text, encoding="utf-8")
          PY
          rm -f "$raw_out"

          {
            echo "## Self-check"
            echo ""
            cat "$summary_out"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=== Ready-to-paste PR Self-check block ==="
          cat "$summary_out"
          exit "$status"

      - name: Upload pr_ready summary artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-ready-summary
          path: ${{ runner.temp }}/pr-ready-summary.md
          if-no-files-found: ignore
          retention-days: 7

  clippy:
    name: "Clippy (verify)"
    needs: scope
    if: inputs.mode == 'verify' && needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ensure sufficient disk space on ubuntu-latest
        run: |
          set -euo pipefail
          avail_gb=$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')
          echo "Available disk space on /: ${avail_gb}G"
          if [ "${avail_gb:-0}" -lt 40 ]; then
            echo "Below 40G threshold; pruning preinstalled SDKs in parallel..."
            sudo rm -rf /usr/share/dotnet &
            sudo rm -rf /usr/local/lib/android &
            sudo rm -rf /opt/ghc &
            sudo rm -rf /opt/hostedtoolcache/CodeQL &
            sudo rm -rf /usr/local/.ghcup &
            wait
          fi
          df -h /

      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain and Linux build dependencies
        run: |
          set -euo pipefail
          if [ -f tools/ci/install_rust.sh ]; then
            HOSTED=true bash tools/ci/install_rust.sh libasound2-dev libudev-dev pkg-config mold
            rustup default stable
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends -o Dpkg::Use-Pty=false libasound2-dev libudev-dev pkg-config mold
            rustup toolchain install stable --profile minimal --component rustfmt --component clippy
            rustup default stable
          fi
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker-features=-lld -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure sccache wrapper
        run: |
          set -euo pipefail
          {
            echo "SCCACHE_GHA_ENABLED=true"
            if [ -f "$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh" ]; then
              chmod +x "$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh"
              echo "RUSTC_WRAPPER=$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh"
            else
              echo "RUSTC_WRAPPER=sccache"
            fi
          } >> "$GITHUB_ENV"

      - name: Cache clippy Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fork-pr-checks-clippy-v1
          cache-on-failure: true
          save-if: true

      - name: Run workspace and server clippy
        env:
          SERVER_BUILD: ${{ needs.scope.outputs.server_build }}
        run: |
          set -euo pipefail
          if [ -f tools/ci/check_warnings.py ]; then
            python3 tools/ci/check_warnings.py cargo clippy --locked --keep-going --workspace --all-targets
            if [ "$SERVER_BUILD" = "true" ]; then
              python3 tools/ci/check_warnings.py cargo clippy --locked -p horizon-client --no-default-features --all-targets
            fi
          else
            cargo clippy --locked --workspace --all-targets -- -D warnings
            if [ "$SERVER_BUILD" = "true" ]; then
              cargo clippy --locked -p horizon-client --no-default-features --all-targets -- -D warnings
            fi
          fi

  tests:
    name: "Rust tests (${{ inputs.mode }})"
    needs: scope
    if: >-
      (inputs.mode == 'verify' && needs.scope.outputs.rust == 'true') ||
      (inputs.mode == 'quick' && (inputs.crates != '' || needs.scope.outputs.rust == 'true')) ||
      (inputs.mode == 'full' && (inputs.crates != '' || inputs.test_filter != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ensure sufficient disk space on ubuntu-latest
        run: |
          set -euo pipefail
          avail_gb=$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')
          echo "Available disk space on /: ${avail_gb}G"
          if [ "${avail_gb:-0}" -lt 40 ]; then
            echo "Below 40G threshold; pruning preinstalled SDKs in parallel..."
            sudo rm -rf /usr/share/dotnet &
            sudo rm -rf /usr/local/lib/android &
            sudo rm -rf /opt/ghc &
            sudo rm -rf /opt/hostedtoolcache/CodeQL &
            sudo rm -rf /usr/local/.ghcup &
            wait
          fi
          df -h /

      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain and Linux build dependencies
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/horizon-scratch"
          mkdir -p "$scratch/home" "$scratch/data" "$scratch/config"
          {
            echo "HORIZON_HOME=$scratch/home"
            echo "XDG_DATA_HOME=$scratch/data"
            echo "XDG_CONFIG_HOME=$scratch/config"
          } >> "$GITHUB_ENV"

          if [ -f tools/ci/install_rust.sh ]; then
            HOSTED=true bash tools/ci/install_rust.sh libasound2-dev libudev-dev pkg-config mold
            rustup default stable
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends -o Dpkg::Use-Pty=false libasound2-dev libudev-dev pkg-config mold
            rustup toolchain install stable --profile minimal --component rustfmt --component clippy
            rustup default stable
          fi
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker-features=-lld -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure sccache wrapper
        run: |
          set -euo pipefail
          {
            echo "SCCACHE_GHA_ENABLED=true"
            if [ -f "$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh" ]; then
              chmod +x "$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh"
              echo "RUSTC_WRAPPER=$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh"
            else
              echo "RUSTC_WRAPPER=sccache"
            fi
          } >> "$GITHUB_ENV"

      - name: Cache test Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fork-pr-checks-tests-v1
          cache-on-failure: true
          save-if: ${{ inputs.mode == 'verify' }}

      - name: Run check and tests
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CRATES: ${{ inputs.crates }}
          INPUT_TEST_FILTER: ${{ inputs.test_filter }}
          INPUT_RUN_IGNORED: ${{ inputs.run_ignored }}
          TOUCHED_CRATES: ${{ needs.scope.outputs.touched_crates }}
        run: |
          set -euo pipefail
          crate_args=()
          has_mod_package=false
          selection="${INPUT_CRATES:-$TOUCHED_CRATES}"
          if [ "$selection" = "__NONE__" ]; then
            echo "No root-workspace Rust crates selected; nothing to test."
            exit 0
          elif [ "$selection" = "__WORKSPACE__" ] || [ -z "$selection" ]; then
            crate_args=(--workspace)
            has_mod_package=true
          else
            for c in $selection; do
              if [ "$c" = "horizon-mod-package" ]; then
                has_mod_package=true
              fi
              crate_args+=(-p "$c")
            done
          fi

          if [ "$has_mod_package" = "true" ]; then
            cargo build --locked -p horizon-mod-package --features runtime-process --example holder_actor
          fi

          if [ "$INPUT_MODE" = "quick" ]; then
            echo "Running cargo check --locked ${crate_args[*]} --all-targets"
            cargo check --locked "${crate_args[@]}" --all-targets
          fi

          test_cmd=(cargo test --locked "${crate_args[@]}" --lib --bins --tests)
          if [ "$has_mod_package" = "true" ]; then
            test_cmd+=(--features horizon-mod-package/index)
          fi
          if [ -n "$INPUT_TEST_FILTER" ]; then
            test_cmd+=("$INPUT_TEST_FILTER")
          fi
          if [ "$INPUT_RUN_IGNORED" = "true" ]; then
            test_cmd+=(-- --ignored)
          fi
          echo "Running ${test_cmd[*]}"
          "${test_cmd[@]}"

  launcher:
    name: "Launcher (verify)"
    needs: scope
    if: inputs.mode == 'verify' && needs.scope.outputs.launcher == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Ensure sufficient disk space on ubuntu-latest
        run: |
          set -euo pipefail
          avail_gb=$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')
          echo "Available disk space on /: ${avail_gb}G"
          if [ "${avail_gb:-0}" -lt 40 ]; then
            echo "Below 40G threshold; pruning preinstalled SDKs in parallel..."
            sudo rm -rf /usr/share/dotnet &
            sudo rm -rf /usr/local/lib/android &
            sudo rm -rf /opt/ghc &
            sudo rm -rf /opt/hostedtoolcache/CodeQL &
            sudo rm -rf /usr/local/.ghcup &
            wait
          fi
          df -h /

      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain and launcher dependencies
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/horizon-launcher-scratch"
          mkdir -p "$scratch/home" "$scratch/data" "$scratch/config" "$scratch/trash" "$scratch/clipboard" "$scratch/desktop"
          {
            echo "HORIZON_LAUNCHER_HOME=$scratch/home"
            echo "XDG_DATA_HOME=$scratch/data"
            echo "XDG_CONFIG_HOME=$scratch/config"
            echo "HORIZON_LAUNCHER_TRASH=$scratch/trash"
            echo "HORIZON_LAUNCHER_CLIPBOARD=$scratch/clipboard"
            echo "HORIZON_LAUNCHER_DESKTOP=$scratch/desktop"
            echo "HORIZON_LAUNCHER_NO_SELF_UPDATE=1"
          } >> "$GITHUB_ENV"

          apt_pkgs=(libasound2-dev libudev-dev pkg-config mold libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev)
          if [ -f tools/ci/install_rust.sh ]; then
            HOSTED=true bash tools/ci/install_rust.sh "${apt_pkgs[@]}"
            rustup default stable
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends -o Dpkg::Use-Pty=false "${apt_pkgs[@]}"
            rustup toolchain install stable --profile minimal --component rustfmt --component clippy
            rustup default stable
          fi
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker-features=-lld -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure sccache wrapper
        run: |
          set -euo pipefail
          {
            echo "SCCACHE_GHA_ENABLED=true"
            if [ -f "$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh" ]; then
              chmod +x "$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh"
              echo "RUSTC_WRAPPER=$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh"
            else
              echo "RUSTC_WRAPPER=sccache"
            fi
          } >> "$GITHUB_ENV"

      - name: Cache launcher workspace dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: launcher
          shared-key: fork-pr-checks-launcher-v1
          cache-on-failure: true
          save-if: true

      - name: Check, clippy, and test launcher
        working-directory: launcher
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          set -euo pipefail
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  mod-api:
    name: "Mod API check"
    needs: scope
    if: >-
      inputs.run_mod_api ||
      ((inputs.mode == 'full' || inputs.mode == 'verify') && needs.scope.outputs.mod_api == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Ensure sufficient disk space on ubuntu-latest
        run: |
          set -euo pipefail
          avail_gb=$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')
          echo "Available disk space on /: ${avail_gb}G"
          if [ "${avail_gb:-0}" -lt 40 ]; then
            echo "Below 40G threshold; pruning preinstalled SDKs in parallel..."
            sudo rm -rf /usr/share/dotnet &
            sudo rm -rf /usr/local/lib/android &
            sudo rm -rf /opt/ghc &
            sudo rm -rf /opt/hostedtoolcache/CodeQL &
            sudo rm -rf /usr/local/.ghcup &
            wait
          fi
          df -h /

      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head_sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Install Rust toolchain and Linux build dependencies
        run: |
          set -euo pipefail
          if [ -f tools/ci/install_rust.sh ]; then
            HOSTED=true bash tools/ci/install_rust.sh pkg-config mold
            rustup default stable
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends -o Dpkg::Use-Pty=false pkg-config mold
            rustup toolchain install stable --profile minimal --component rustfmt --component clippy
            rustup default stable
          fi
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker-features=-lld -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure sccache wrapper
        run: |
          set -euo pipefail
          {
            echo "SCCACHE_GHA_ENABLED=true"
            if [ -f "$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh" ]; then
              chmod +x "$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh"
              echo "RUSTC_WRAPPER=$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh"
            else
              echo "RUSTC_WRAPPER=sccache"
            fi
          } >> "$GITHUB_ENV"

      - name: Cache mod-api-gen dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fork-pr-checks-mod-api-v1
          cache-on-failure: true
          save-if: true

      - name: Run tools/check_mod_api_unchanged.py
        env:
          BASE_REF: ${{ needs.scope.outputs.base_ref }}
          MERGE_BASE: ${{ needs.scope.outputs.merge_base }}
        run: |
          set -euo pipefail
          trap 'rm -rf "${CARGO_TARGET_DIR:-target}/mod-api-base"' EXIT
          python3 tools/check_mod_api_unchanged.py --base "$MERGE_BASE" --allow-added
          {
            echo "## Mod API check"
            echo ""
            echo "- \`tools/check_mod_api_unchanged.py --base ${MERGE_BASE:0:12} --allow-added\` (merge base with \`${BASE_REF}\`): passed"
          } >> "$GITHUB_STEP_SUMMARY"

  build-fast:
    name: "Build horizon-game (--profile fast)"
    needs: scope
    if: inputs.build_fast
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ensure sufficient disk space on ubuntu-latest
        run: |
          set -euo pipefail
          avail_gb=$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')
          echo "Available disk space on /: ${avail_gb}G"
          if [ "${avail_gb:-0}" -lt 40 ]; then
            echo "Below 40G threshold; pruning preinstalled SDKs in parallel..."
            sudo rm -rf /usr/share/dotnet &
            sudo rm -rf /usr/local/lib/android &
            sudo rm -rf /opt/ghc &
            sudo rm -rf /opt/hostedtoolcache/CodeQL &
            sudo rm -rf /usr/local/.ghcup &
