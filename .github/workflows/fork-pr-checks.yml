name: Fork PR Checks

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA on this fork to check
        required: true
        type: string
      base:
        description: Upstream branch on horizon-rust/horizon to diff against
        required: false
        default: main
        type: string
      mode:
        description: "Check suite: pr-ready (Self-check block), verify (parallel clippy+tests), quick (targeted), full (all)"
        required: false
        default: pr-ready
        type: choice
        options:
          - pr-ready
          - verify
          - quick
          - full
      crates:
        description: Optional space-separated crate names (e.g. horizon-client-lib horizon-world)
        required: false
        default: ""
        type: string
      test_filter:
        description: Optional cargo test filter (used in quick/verify or as an extra job in full mode)
        required: false
        default: ""
        type: string
      run_ignored:
        description: Pass -- --ignored to targeted test_filter runs (requires test_filter; no vanilla .local/ data)
        required: false
        default: false
        type: boolean
      run_mod_api:
        description: Force parallel tools/check_mod_api_unchanged.py --allow-added (auto-runs in verify/full when mod API is touched)
        required: false
        default: false
        type: boolean
      build_fast:
        description: Also run parallel cargo build --locked --profile fast -p horizon-game
        required: false
        default: false
        type: boolean
      fail_fast:
        description: Gate pr-ready on fast-checks passing first (skip 30m Rust run on fast lint/fmt/Python failures)
        required: false
        default: true
        type: boolean
      skip_fast_checks:
        description: Skip the fast-checks job in any mode (verify, quick, pr-ready, full)
        required: false
        default: false
        type: boolean
      force_pr_ready:
        description: Force PR Ready (Self-check) to run immediately in pr-ready/full mode, bypassing fast-checks
        required: false
        default: false
        type: boolean
      allow_fork_base_fallback:
        description: Fall back to fork origin/<base> if upstream horizon-rust/horizon cannot be fetched
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-pr-checks-${{ inputs.ref }}
  cancel-in-progress: true

env:
  HORIZON_TELEMETRY_URL: "off"
  HORIZON_NO_AUDIO: "1"
  WGPU_BACKEND: "dx12"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep Cargo.toml's [profile.dev] debug = "line-tables-only":
  # crash::tests::the_debug_crash_is_reported_as_vanillas requires line tables,
  # and uniform debuginfo + RUSTFLAGS maximize Swatinem/rust-cache sharing across jobs.

jobs:
  scope:
    name: "Scope (${{ inputs.mode }} @ ${{ inputs.ref }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base_ref: ${{ steps.inspect.outputs.base_ref }}
      base_sha: ${{ steps.inspect.outputs.base_sha }}
      base_fallback: ${{ steps.inspect.outputs.base_fallback }}
      head_sha: ${{ steps.inspect.outputs.head_sha }}
      merge_base: ${{ steps.inspect.outputs.merge_base }}
      rust: ${{ steps.inspect.outputs.rust }}
      server_build: ${{ steps.inspect.outputs.server_build }}
      launcher: ${{ steps.inspect.outputs.launcher }}
      mod_api: ${{ steps.inspect.outputs.mod_api }}
      touched_crates: ${{ steps.inspect.outputs.touched_crates }}
    steps:
      - name: Validate inputs
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_CRATES: ${{ inputs.crates }}
          INPUT_RUN_IGNORED: ${{ inputs.run_ignored }}
          INPUT_TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          set -euo pipefail
          if [ -z "$INPUT_REF" ] || [[ "$INPUT_REF" = -* ]] || [[ "$INPUT_REF" =~ [[:space:]\`] ]] || [[ "$INPUT_REF" == *".."* ]]; then
            echo "::error::Invalid ref: $INPUT_REF"
            exit 1
          fi
          if [ "$INPUT_REF" = "fork-ci" ]; then
            echo "::error::Cannot run checks against the fork-ci branch itself. Pass a feature branch or commit SHA."
            exit 1
          fi
          if [[ ! "$INPUT_BASE" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$INPUT_BASE" = -* ]] || [[ "$INPUT_BASE" == *".."* ]]; then
            echo "::error::Invalid base branch name: $INPUT_BASE"
            exit 1
          fi
          if [ "$INPUT_RUN_IGNORED" = "true" ] && [ -z "$INPUT_TEST_FILTER" ]; then
            echo "::error::run_ignored=true requires test_filter so data-backed daily tests are not run without vanilla resources."
            exit 1
          fi
          if [ -n "$INPUT_CRATES" ]; then
            for c in $INPUT_CRATES; do
              if [[ ! "$c" =~ ^[A-Za-z0-9_-]+$ ]]; then
                echo "::error::Invalid crate name: $c"
                exit 1
              fi
            done
          fi

      - name: Checkout target ref from fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch upstream base ref and compute scope
        id: inspect
        env:
          INPUT_BASE: ${{ inputs.base }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_MODE: ${{ inputs.mode }}
          ALLOW_FORK_BASE_FALLBACK: ${{ inputs.allow_fork_base_fallback }}
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/horizon-rust/horizon.git
          base_fallback=false
          if ! git fetch --no-tags --filter=blob:none upstream "refs/heads/${INPUT_BASE}:refs/remotes/upstream/${INPUT_BASE}"; then
            if [ "$ALLOW_FORK_BASE_FALLBACK" = "true" ]; then
              base_fallback=true
              echo "::warning::Failed to fetch upstream horizon-rust/horizon (${INPUT_BASE}); falling back to fork origin/${INPUT_BASE} (allow_fork_base_fallback=true)."
              git fetch --no-tags --filter=blob:none origin "refs/heads/${INPUT_BASE}:refs/remotes/upstream/${INPUT_BASE}"
            else
              echo "::error::Failed to fetch upstream horizon-rust/horizon (${INPUT_BASE}). Refusing to silently fall back to fork origin/${INPUT_BASE}. Re-run with allow_fork_base_fallback=true (--allow-fork-base) if upstream is temporarily unavailable and fork ${INPUT_BASE} is up to date."
              exit 1
            fi
          fi

          BASE_REF="upstream/${INPUT_BASE}"
          BASE_SHA="$(git rev-parse "$BASE_REF")"
          HEAD_SHA="$(git rev-parse HEAD)"
          MERGE_BASE="$(git merge-base HEAD "$BASE_REF")"

          # Fail closed to true if rust_changes.py is missing or errors (matching upstream ci.yml).
          rust_needed=true
          server_needed=true
          launcher_needed=true
          mod_api_needed=true
          if [ -f tools/ci/rust_changes.py ]; then
            if rust_out="$(python3 tools/ci/rust_changes.py "$MERGE_BASE" "$HEAD_SHA")"; then
              rust_needed="$(printf '%s\n' "$rust_out" | awk -F= '$1=="required"{print $2}' | tail -n1)"
              server_needed="$(printf '%s\n' "$rust_out" | awk -F= '$1=="server_build"{print $2}' | tail -n1)"
              mod_api_needed="$(printf '%s\n' "$rust_out" | awk -F= '$1=="mod_api"{print $2}' | tail -n1)"
            else
              echo "::warning::tools/ci/rust_changes.py failed; defaulting root Rust checks to true."
            fi
            if launcher_out="$(python3 tools/ci/rust_changes.py --launcher "$MERGE_BASE" "$HEAD_SHA")"; then
              launcher_needed="$(printf '%s\n' "$launcher_out" | awk -F= '$1=="required"{print $2}' | tail -n1)"
            else
              echo "::warning::tools/ci/rust_changes.py --launcher failed; defaulting launcher check to true."
            fi
          fi
          rust_needed="${rust_needed:-true}"
          server_needed="${server_needed:-true}"
          launcher_needed="${launcher_needed:-true}"
          mod_api_needed="${mod_api_needed:-true}"

          touched="$(python3 - "$BASE_REF" <<'PY'
          import sys
          sys.path.insert(0, ".")
          from tools import parity, pr_ready

          changed = parity.changed_files(sys.argv[1]) or []
          if not any(pr_ready.workspace_rust(p) for p in changed):
              print("__NONE__")
              sys.exit(0)
          crates_of, _, _ = pr_ready.packages()
          crates = pr_ready.touched_crates(changed, crates_of)
          # Match pr_ready.py: workspace Rust changed with empty crate list -> full workspace.
          if crates is None or not crates:
              print("__WORKSPACE__")
          else:
              print(" ".join(crates))
          PY
          )"

          {
            echo "base_ref=$BASE_REF"
            echo "base_sha=$BASE_SHA"
            echo "base_fallback=$base_fallback"
            echo "head_sha=$HEAD_SHA"
            echo "merge_base=$MERGE_BASE"
            echo "rust=$rust_needed"
            echo "server_build=$server_needed"
            echo "launcher=$launcher_needed"
            echo "mod_api=$mod_api_needed"
            echo "touched_crates=$touched"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Scope (\`${INPUT_MODE}\`)"
            echo ""
            if [ "$base_fallback" = "true" ]; then
              echo "> [!WARNING]"
              echo "> **Upstream fetch failed (\`horizon-rust/horizon:${INPUT_BASE}\`).** Automatically fell back to fork \`origin/${INPUT_BASE}\` (\`${BASE_SHA:0:12}\`). Verify \`fork/${INPUT_BASE}\` matches upstream before trusting scope or baselines."
              echo ""
            fi
            echo "- **Ref:** \`${INPUT_REF}\` (\`${HEAD_SHA:0:12}\`)"
            if [ "$base_fallback" = "true" ]; then
              echo "- **Base:** fork \`origin/${INPUT_BASE}\` (\`${BASE_SHA:0:12}\`, merge base \`${MERGE_BASE:0:12}\`)"
            else
              echo "- **Base:** \`horizon-rust/horizon:${INPUT_BASE}\` (\`${BASE_SHA:0:12}\`, merge base \`${MERGE_BASE:0:12}\`)"
            fi
            echo "- **Flags:** rust=\`${rust_needed}\`, server=\`${server_needed}\`, launcher=\`${launcher_needed}\`, mod_api=\`${mod_api_needed}\`"
            echo "- **Touched crates:** \`${touched}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Ref '${INPUT_REF}' at ${HEAD_SHA} vs ${BASE_REF} (${BASE_SHA}, fallback=${base_fallback}, merge base ${MERGE_BASE})"
          echo "Scope: rust=$rust_needed server=$server_needed launcher=$launcher_needed mod_api=$mod_api_needed touched=$touched"

  fast-checks:
    name: "Fast checks (fmt, tree, layers, hotspots, Python)"
    needs: scope
    if: >-
      !cancelled() &&
      needs.scope.result == 'success' &&
      !inputs.skip_fast_checks &&
      !(inputs.force_pr_ready && (inputs.mode == 'pr-ready' || inputs.mode == 'full'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head_sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install current stable Rust toolchain (rustfmt + cargo metadata)
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Pin deterministic base ref from scope
        env:
          INPUT_BASE: ${{ inputs.base }}
          MERGE_BASE: ${{ needs.scope.outputs.merge_base }}
        run: |
          set -euo pipefail
          git update-ref "refs/remotes/upstream/${INPUT_BASE}" "$MERGE_BASE"

      - name: Set up scratch directories
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/horizon-scratch"
          mkdir -p "$scratch/home" "$scratch/data" "$scratch/config"
          {
            echo "HORIZON_HOME=$scratch/home"
            echo "XDG_DATA_HOME=$scratch/data"
            echo "XDG_CONFIG_HOME=$scratch/config"
          } >> "$GITHUB_ENV"

      - name: Public tree check
        id: public_tree
        continue-on-error: true
        env:
          MERGE_BASE: ${{ needs.scope.outputs.merge_base }}
        run: |
          set -euo pipefail
          python3 tools/check_public_tree.py
          python3 tools/check_public_tree.py --range "${MERGE_BASE}..HEAD"

      - name: Repository hygiene check
        id: repo_hygiene
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -f tools/ci/check_repository_hygiene.py ]; then
            python3 tools/ci/check_repository_hygiene.py
          fi

      - name: Layer check
        id: layers
        continue-on-error: true
        env:
          BASE_REF: ${{ needs.scope.outputs.base_ref }}
        run: python3 tools/check_layers.py --base "$BASE_REF"

      - name: Address check
        id: addresses
        continue-on-error: true
        env:
          BASE_REF: ${{ needs.scope.outputs.base_ref }}
        run: python3 tools/check_addresses.py --base "$BASE_REF"

      - name: Rustfmt check (root workspace changed files)
        id: rustfmt_root
        continue-on-error: true
        env:
          MERGE_BASE: ${{ needs.scope.outputs.merge_base }}
        run: |
          set -euo pipefail
          python3 - "$MERGE_BASE" <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          merge_base = sys.argv[1]
          out = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMR", f"{merge_base}...HEAD", "--", "*.rs", ":!launcher/"],
              text=True,
          )
          files = [p for p in out.splitlines() if p and Path(p).is_file()]
          if not files:
              sys.exit(0)

          root = Path(".").resolve()
          ws_edition = "2024"
          root_toml = root / "Cargo.toml"
          if root_toml.is_file():
              data = tomllib.loads(root_toml.read_text(encoding="utf-8"))
              ws_edition = str(data.get("workspace", {}).get("package", {}).get("edition", ws_edition))

          def edition_for(path: str) -> str:
              cur = (root / path).resolve().parent
              while True:
                  manifest = cur / "Cargo.toml"
                  if manifest.is_file():
                      data = tomllib.loads(manifest.read_text(encoding="utf-8"))
                      ed = data.get("package", {}).get("edition")
                      if isinstance(ed, str):
                          return ed
                      if isinstance(ed, dict) and ed.get("workspace"):
                          return ws_edition
                      if cur == root:
                          return ws_edition
                  if cur == root or cur.parent == cur:
                      return ws_edition
                  cur = cur.parent

          by_edition: dict[str, list[str]] = {}
          for f in files:
              by_edition.setdefault(edition_for(f), []).append(f)

          failed = 0
          for ed, group in sorted(by_edition.items()):
              print(f"Checking rustfmt (edition {ed}) on {len(group)} changed Rust file(s)...")
              rc = subprocess.run(
                  ["rustfmt", "--edition", ed, "--check", "--config", "skip_children=true", *group]
              ).returncode
              if rc != 0:
                  failed = 1
          sys.exit(failed)
          PY

      - name: Rustfmt check (launcher changed files)
        id: rustfmt_launcher
        continue-on-error: true
        env:
          MERGE_BASE: ${{ needs.scope.outputs.merge_base }}
        run: |
          set -euo pipefail
          mapfile -t changed_launcher_rs < <(git diff --name-only --diff-filter=ACMR "$MERGE_BASE"...HEAD -- ':(glob)launcher/**/*.rs')
          if [ "${#changed_launcher_rs[@]}" -gt 0 ]; then
            echo "Checking launcher rustfmt..."
            cargo fmt --manifest-path launcher/Cargo.toml -- --check
          fi

      - name: Nested locks check
        id: nested_locks
        continue-on-error: true
        env:
          MERGE_BASE: ${{ needs.scope.outputs.merge_base }}
        run: |
          set -euo pipefail
          if [ -f tools/ci/nested_locks.py ]; then
            python3 tools/ci/nested_locks.py --base "$MERGE_BASE"
          fi

      - name: Hotspot lists check
        id: hotspot_lists
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -f tools/hotspots/check_lists.py ]; then
            python3 tools/hotspots/check_lists.py
          fi

      - name: Hotspot stand-ins check
        id: hotspot_stand_ins
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -f tools/hotspots/check_stand_ins.py ]; then
            python3 tools/hotspots/check_stand_ins.py
          fi

      - name: Python unit tests
        id: python_tests
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -f tools/ci/unittest_parallel.py ]; then
            env -u GITHUB_REPOSITORY python3 tools/ci/unittest_parallel.py
          else
            env -u GITHUB_REPOSITORY python3 -m unittest discover -s tests
          fi

      - name: Summarize and gate fast-checks
        env:
          OUT_PUBLIC_TREE: ${{ steps.public_tree.outcome }}
          OUT_REPO_HYGIENE: ${{ steps.repo_hygiene.outcome }}
          OUT_LAYERS: ${{ steps.layers.outcome }}
          OUT_ADDRESSES: ${{ steps.addresses.outcome }}
          OUT_RUSTFMT_ROOT: ${{ steps.rustfmt_root.outcome }}
          OUT_RUSTFMT_LAUNCHER: ${{ steps.rustfmt_launcher.outcome }}
          OUT_NESTED_LOCKS: ${{ steps.nested_locks.outcome }}
          OUT_HOTSPOT_LISTS: ${{ steps.hotspot_lists.outcome }}
          OUT_HOTSPOT_STAND_INS: ${{ steps.hotspot_stand_ins.outcome }}
          OUT_PYTHON_TESTS: ${{ steps.python_tests.outcome }}
        run: |
          set -euo pipefail
          failed=0
          {
            echo "## Fast checks"
            echo ""
            echo "| Check | Outcome |"
            echo "| --- | --- |"
            for pair in \
              "Public tree:${OUT_PUBLIC_TREE}" \
              "Repository hygiene:${OUT_REPO_HYGIENE}" \
              "Layers:${OUT_LAYERS}" \
              "Addresses:${OUT_ADDRESSES}" \
              "Rustfmt (root changed files):${OUT_RUSTFMT_ROOT}" \
              "Rustfmt (launcher changed files):${OUT_RUSTFMT_LAUNCHER}" \
              "Nested locks:${OUT_NESTED_LOCKS}" \
              "Hotspot lists:${OUT_HOTSPOT_LISTS}" \
              "Hotspot stand-ins:${OUT_HOTSPOT_STAND_INS}" \
              "Python unit tests:${OUT_PYTHON_TESTS}"
            do
              name="${pair%%:*}"
              outcome="${pair#*:}"
              if [ "$outcome" = "success" ]; then
                echo "| ${name} | ✅ pass |"
              else
                echo "| ${name} | ❌ ${outcome} |"
                failed=1
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more fast-checks failed; see the Fast checks summary table."
            exit 1
          fi

  pr-ready:
    name: "PR Ready (Self-check)"
    needs: [scope, fast-checks]
    if: >-
      !cancelled() &&
      needs.scope.result == 'success' &&
      (inputs.mode == 'pr-ready' || inputs.mode == 'full') &&
      (inputs.skip_fast_checks || inputs.force_pr_ready || !inputs.fail_fast || needs.fast-checks.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Ensure sufficient disk space and swap on ubuntu-latest
        run: |
          set -euo pipefail
          avail_gb=$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')
          echo "Available disk space on /: ${avail_gb}G"
          if [ "${avail_gb:-0}" -lt 40 ]; then
            echo "Below 40G threshold; pruning preinstalled SDKs in parallel..."
            sudo rm -rf /usr/share/dotnet &
            sudo rm -rf /usr/local/lib/android &
            sudo rm -rf /opt/ghc &
            sudo rm -rf /opt/hostedtoolcache/CodeQL &
            sudo rm -rf /usr/local/.ghcup &
            wait
          fi
          swap_mb=$(free -m | awk '/^Swap:/{print $2}')
          if [ "${swap_mb:-0}" -lt 4096 ]; then
            mnt_gb=$(df -BG --output=avail /mnt 2>/dev/null | tail -n 1 | tr -dc '0-9' || echo 0)
            if [ -d /mnt ] && [ "${mnt_gb:-0}" -ge 12 ]; then
              swap_path=/mnt/swapfile_ci
            else
              swap_path=/swapfile_ci
            fi
            echo "Enabling 8G swapfile at ${swap_path} (current swap: ${swap_mb:-0}M)..."
            sudo fallocate -l 8G "$swap_path"
            sudo chmod 600 "$swap_path"
            sudo mkswap "$swap_path" >/dev/null
            sudo swapon "$swap_path"
          fi
          free -h
          df -h / /mnt 2>/dev/null || df -h /

      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head_sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Pin deterministic base ref from scope
        env:
          INPUT_BASE: ${{ inputs.base }}
          MERGE_BASE: ${{ needs.scope.outputs.merge_base }}
        run: |
          set -euo pipefail
          git update-ref "refs/remotes/upstream/${INPUT_BASE}" "$MERGE_BASE"

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Rust toolchain and Linux build dependencies
        env:
          NEED_LAUNCHER: ${{ needs.scope.outputs.launcher }}
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/horizon-scratch"
          mkdir -p "$scratch/home" "$scratch/data" "$scratch/config"
          {
            echo "HORIZON_HOME=$scratch/home"
            echo "XDG_DATA_HOME=$scratch/data"
            echo "XDG_CONFIG_HOME=$scratch/config"
          } >> "$GITHUB_ENV"

          apt_pkgs=(libasound2-dev libudev-dev pkg-config mold)
          if [ "$NEED_LAUNCHER" = "true" ]; then
            apt_pkgs+=(libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev)
          fi
          if [ -f tools/ci/install_rust.sh ]; then
            HOSTED=true bash tools/ci/install_rust.sh "${apt_pkgs[@]}"
            rustup default stable
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends -o Dpkg::Use-Pty=false "${apt_pkgs[@]}"
            rustup toolchain install stable --profile minimal --component rustfmt --component clippy
            rustup default stable
          fi
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker-features=-lld -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: Cache Cargo registry and build dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fork-pr-checks-root-v2
          cache-on-failure: true
          save-if: ${{ needs.scope.outputs.rust == 'true' }}

      - name: Cache launcher workspace dependencies
        if: needs.scope.outputs.launcher == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: launcher
          shared-key: fork-pr-checks-launcher-v2
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ needs.scope.outputs.launcher == 'true' }}

      - name: Run tools/pr_ready.py
        env:
          BASE_REF: ${{ needs.scope.outputs.base_ref }}
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
          BASE_FALLBACK: ${{ needs.scope.outputs.base_fallback }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          raw_out="$RUNNER_TEMP/pr-ready-raw.md"
          summary_out="$RUNNER_TEMP/pr-ready-summary.md"
          status=0
          timeout --signal=INT --kill-after=60 4800 env -u GITHUB_REPOSITORY python3 tools/pr_ready.py --base "$BASE_REF" >"$raw_out" || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::warning::tools/pr_ready.py hit the 80m soft timeout; saving partial Cargo cache and timeout note."
          fi

          python3 - "$raw_out" "$summary_out" "$status" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace") if Path(sys.argv[1]).is_file() else ""
          status = int(sys.argv[3])
          if not text.strip() and status == 124:
              text = "**pr_ready** timed out at the 80 min soft limit before printing its summary block; Cargo build cache was preserved for the next run.\n"
          text = re.sub(r"host `[^`]+`", "host `ci`", text)
          Path(sys.argv[2]).write_text(text, encoding="utf-8")
          PY
          rm -f "$raw_out"

          {
            echo "## Self-check"
            echo ""
            if [ "$BASE_FALLBACK" = "true" ]; then
              echo "> [!WARNING]"
              echo "> Diffed against fork \`origin/${INPUT_BASE}\` (\`${BASE_SHA:0:12}\`) because upstream \`horizon-rust/horizon\` could not be fetched."
              echo ""
            fi
            cat "$summary_out"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=== Ready-to-paste PR Self-check block ==="
          cat "$summary_out"
          exit "$status"

      - name: Upload pr_ready summary artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-ready-summary
          path: ${{ runner.temp }}/pr-ready-summary.md
          if-no-files-found: ignore
          retention-days: 7

  clippy:
    name: "Clippy (verify)"
    needs: scope
    if: inputs.mode == 'verify' && needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ensure sufficient disk space and swap on ubuntu-latest
        run: |
          set -euo pipefail
          avail_gb=$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')
          echo "Available disk space on /: ${avail_gb}G"
          if [ "${avail_gb:-0}" -lt 40 ]; then
            echo "Below 40G threshold; pruning preinstalled SDKs in parallel..."
            sudo rm -rf /usr/share/dotnet &
            sudo rm -rf /usr/local/lib/android &
            sudo rm -rf /opt/ghc &
            sudo rm -rf /opt/hostedtoolcache/CodeQL &
            sudo rm -rf /usr/local/.ghcup &
            wait
          fi
          swap_mb=$(free -m | awk '/^Swap:/{print $2}')
          if [ "${swap_mb:-0}" -lt 4096 ]; then
            mnt_gb=$(df -BG --output=avail /mnt 2>/dev/null | tail -n 1 | tr -dc '0-9' || echo 0)
            if [ -d /mnt ] && [ "${mnt_gb:-0}" -ge 12 ]; then
              swap_path=/mnt/swapfile_ci
            else
              swap_path=/swapfile_ci
            fi
            echo "Enabling 8G swapfile at ${swap_path} (current swap: ${swap_mb:-0}M)..."
            sudo fallocate -l 8G "$swap_path"
            sudo chmod 600 "$swap_path"
            sudo mkswap "$swap_path" >/dev/null
            sudo swapon "$swap_path"
          fi
          free -h
          df -h / /mnt 2>/dev/null || df -h /

      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain and Linux build dependencies
        run: |
          set -euo pipefail
          if [ -f tools/ci/install_rust.sh ]; then
            HOSTED=true bash tools/ci/install_rust.sh libasound2-dev libudev-dev pkg-config mold
            rustup default stable
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends -o Dpkg::Use-Pty=false libasound2-dev libudev-dev pkg-config mold
            rustup toolchain install stable --profile minimal --component rustfmt --component clippy
            rustup default stable
          fi
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker-features=-lld -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: Cache shared root Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fork-pr-checks-root-v2
          cache-on-failure: true
          save-if: true

      - name: Run workspace and server clippy
        run: |
          set -euo pipefail
          rc=0
          if [ -f tools/ci/check_warnings.py ]; then
            python3 tools/ci/check_warnings.py cargo clippy --locked --keep-going --workspace --all-targets || rc=1
            python3 tools/ci/check_warnings.py cargo clippy --locked --keep-going -p horizon-client -p horizon-game -p horizon-mod-host --no-default-features --all-targets || rc=1
          else
            cargo clippy --locked --workspace --all-targets -- -D warnings || rc=1
            cargo clippy --locked -p horizon-client -p horizon-game -p horizon-mod-host --no-default-features --all-targets -- -D warnings || rc=1
          fi
          exit "$rc"

  tests:
    name: "Rust tests (${{ inputs.mode }})"
    needs: scope
    if: >-
      (inputs.mode == 'verify' && needs.scope.outputs.rust == 'true') ||
      (inputs.mode == 'quick' && (inputs.crates != '' || inputs.test_filter != '' || needs.scope.outputs.rust == 'true')) ||
      (inputs.mode == 'full' && (inputs.crates != '' || inputs.test_filter != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ensure sufficient disk space and swap on ubuntu-latest
        run: |
          set -euo pipefail
          avail_gb=$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')
          echo "Available disk space on /: ${avail_gb}G"
          if [ "${avail_gb:-0}" -lt 40 ]; then
            echo "Below 40G threshold; pruning preinstalled SDKs in parallel..."
            sudo rm -rf /usr/share/dotnet &
            sudo rm -rf /usr/local/lib/android &
            sudo rm -rf /opt/ghc &
            sudo rm -rf /opt/hostedtoolcache/CodeQL &
            sudo rm -rf /usr/local/.ghcup &
            wait
          fi
          swap_mb=$(free -m | awk '/^Swap:/{print $2}')
          if [ "${swap_mb:-0}" -lt 4096 ]; then
            mnt_gb=$(df -BG --output=avail /mnt 2>/dev/null | tail -n 1 | tr -dc '0-9' || echo 0)
            if [ -d /mnt ] && [ "${mnt_gb:-0}" -ge 12 ]; then
              swap_path=/mnt/swapfile_ci
            else
              swap_path=/swapfile_ci
            fi
            echo "Enabling 8G swapfile at ${swap_path} (current swap: ${swap_mb:-0}M)..."
            sudo fallocate -l 8G "$swap_path"
            sudo chmod 600 "$swap_path"
            sudo mkswap "$swap_path" >/dev/null
            sudo swapon "$swap_path"
          fi
          free -h
          df -h / /mnt 2>/dev/null || df -h /

      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain and Linux build dependencies
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/horizon-scratch"
          mkdir -p "$scratch/home" "$scratch/data" "$scratch/config"
          {
            echo "HORIZON_HOME=$scratch/home"
            echo "XDG_DATA_HOME=$scratch/data"
            echo "XDG_CONFIG_HOME=$scratch/config"
          } >> "$GITHUB_ENV"

          if [ -f tools/ci/install_rust.sh ]; then
            HOSTED=true bash tools/ci/install_rust.sh libasound2-dev libudev-dev pkg-config mold
            rustup default stable
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends -o Dpkg::Use-Pty=false libasound2-dev libudev-dev pkg-config mold
            rustup toolchain install stable --profile minimal --component rustfmt --component clippy
            rustup default stable
          fi
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker-features=-lld -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: Cache shared root Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fork-pr-checks-root-v2
          cache-on-failure: true
          save-if: ${{ inputs.mode == 'verify' }}

      - name: Run check and tests
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CRATES: ${{ inputs.crates }}
          INPUT_TEST_FILTER: ${{ inputs.test_filter }}
          INPUT_RUN_IGNORED: ${{ inputs.run_ignored }}
          TOUCHED_CRATES: ${{ needs.scope.outputs.touched_crates }}
        run: |
          set -euo pipefail
          crate_args=()
          selected_crates=()
          need_holder_actor=false
          need_mod_package_index=false
          selection="${INPUT_CRATES:-$TOUCHED_CRATES}"
          if [ "$selection" = "__NONE__" ]; then
            if [ -n "$INPUT_TEST_FILTER" ]; then
              selection="__WORKSPACE__"
            else
              echo "No root-workspace Rust crates selected; nothing to test."
              exit 0
            fi
          fi
          if [ "$selection" = "__WORKSPACE__" ] || [ -z "$selection" ]; then
            crate_args=(--workspace)
            need_holder_actor=true
          else
            for c in $selection; do
              if [ "$c" = "horizon-mod-package" ]; then
                need_holder_actor=true
                need_mod_package_index=true
              fi
              selected_crates+=("$c")
              crate_args+=(-p "$c")
            done
          fi

          if [ "$need_holder_actor" = "true" ]; then
            cargo build --locked -p horizon-mod-package --features runtime-process --example holder_actor
          fi

          if [ "$INPUT_MODE" = "quick" ] && [ -z "$INPUT_TEST_FILTER" ]; then
            echo "Running cargo check --locked ${crate_args[*]} --all-targets"
            cargo check --locked "${crate_args[@]}" --all-targets
          fi

          test_cmd=(cargo test --locked "${crate_args[@]}" --lib --bins --tests)
          if [ "$need_mod_package_index" = "true" ]; then
            test_cmd+=(--features horizon-mod-package/index)
          fi
          if [ -n "$INPUT_TEST_FILTER" ]; then
            read -r -a filter_args <<< "$INPUT_TEST_FILTER"
            test_cmd+=("${filter_args[@]}")
          fi
          if [ "$INPUT_RUN_IGNORED" = "true" ]; then
            test_cmd+=(-- --ignored)
          fi
          echo "Running ${test_cmd[*]}"
          "${test_cmd[@]}"

          if [ "$INPUT_MODE" = "verify" ] && [ -z "$INPUT_TEST_FILTER" ]; then
            if [ "${crate_args[0]}" = "--workspace" ]; then
              doc_cmd=(cargo test --locked --workspace --doc)
              echo "Running ${doc_cmd[*]}"
              "${doc_cmd[@]}"
            else
              mapfile -t doc_crates < <(python3 - "${selected_crates[@]}" <<'PY'
          import json
          import subprocess
          import sys

          wanted = set(sys.argv[1:])
          meta = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"], text=True))
          for pkg in meta["packages"]:
              if pkg["name"] in wanted and any("lib" in t["kind"] for t in pkg["targets"]):
                  print(pkg["name"])
          PY
              )
              if [ "${#doc_crates[@]}" -gt 0 ]; then
                doc_cmd=(cargo test --locked)
                for c in "${doc_crates[@]}"; do
                  doc_cmd+=(-p "$c")
                done
                doc_cmd+=(--doc)
                echo "Running ${doc_cmd[*]}"
                "${doc_cmd[@]}"
              else
                echo "No library targets in selected crates; skipping --doc tests."
              fi
            fi
          fi

